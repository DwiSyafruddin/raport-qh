<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Quran Hadits - Ibu Wirdaningsih</title>
    
    <!-- Library Pendukung -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase (Sudah tertanam)
        const firebaseConfig = {
            apiKey: "AIzaSyBgakl49meoZwBa9rMnAo56OoRXryRGGrE",
            authDomain: "raport-qh.firebaseapp.com",
            projectId: "raport-qh",
            storageBucket: "raport-qh.firebasestorage.app",
            messagingSenderId: "692865457759",
            appId: "1:692865457759:web:4312876da3fe64e653c5ea",
            measurementId: "G-MNY5XJ0S0B"
        };
        
        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);
            window.fbServices = { db, auth, doc, onSnapshot, setDoc, signInAnonymously };
            console.log("Firebase Siap!");
        } catch (e) {
            console.error("Firebase Error:", e);
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f0fdf4; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-left-color: #16a34a; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // --- STATE APLIKASI ---
            const [view, setView] = useState('loading'); // loading, dashboard, app
            const [syncStatus, setSyncStatus] = useState('offline');
            
            // Konfigurasi Tahun & Semester
            const [baseCode] = useState('WIRDANINGSIH'); // KODE TETAP
            const [selectedYear, setSelectedYear] = useState('2025/2026');
            const [selectedSemester, setSelectedSemester] = useState('2'); // 1 = Ganjil, 2 = Genap
            
            // Data Nilai
            const [activeTab, setActiveTab] = useState('siswa');
            const [selectedClass, setSelectedClass] = useState('1A');
            const [students, setStudents] = useState([]);
            const [topics, setTopics] = useState([]);
            const [topicGrades, setTopicGrades] = useState({});
            const [summativeGrades, setSummativeGrades] = useState({});

            // Edit Inputs
            const [isGradeEditable, setIsGradeEditable] = useState(false);
            const [tempStudentName, setTempStudentName] = useState('');
            const [tempTopicName, setTempTopicName] = useState('');
            const [tempKKM, setTempKKM] = useState('70');
            const [selectedTopicIdForInput, setSelectedTopicIdForInput] = useState('');
            const [inputType, setInputType] = useState('materi');
            
            // Helpers
            const [editingStudentId, setEditingStudentId] = useState(null);
            const [editStudentName, setEditStudentName] = useState('');
            const excelInputRef = useRef(null);
            
            const classList = ['1A', '1B', '2A', '2B', '3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'];
            const getGradeLevel = (cls) => cls.charAt(0);
            const yearList = ['2024/2025', '2025/2026', '2026/2027', '2027/2028', '2028/2029'];

            // ID Dokumen Unik di Firebase: WIRDANINGSIH_2025-2026_S2
            // Ini membuat data tidak tertukar antar tahun/semester
            const getDocumentId = () => {
                const yearClean = selectedYear.replace('/', '-');
                return `${baseCode}_${yearClean}_S${selectedSemester}`;
            };

            // --- INISIALISASI ---
            useEffect(() => {
                setTimeout(() => setView('dashboard'), 1000);
            }, []);

            // --- FUNGSI MASUK (LOGIN OTOMATIS) ---
            const handleEnterApp = async () => {
                if (window.fbServices) {
                    const { auth, signInAnonymously } = window.fbServices;
                    try {
                        await signInAnonymously(auth);
                        setView('app');
                    } catch (e) {
                        alert("Gagal koneksi server. Cek internet.");
                    }
                } else {
                    alert("Sedang memuat sistem... Coba sesaat lagi.");
                }
            };

            // --- KONEKSI DATABASE (REALTIME) ---
            useEffect(() => {
                if (view === 'app' && window.fbServices) {
                    const { db, doc, onSnapshot } = window.fbServices;
                    setSyncStatus('syncing');

                    const docId = getDocumentId();
                    const docRef = doc(db, "schools", docId);
                    
                    const unsubscribe = onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            setStudents(data.students || []);
                            setTopics(data.topics || []);
                            setTopicGrades(data.topicGrades || {});
                            setSummativeGrades(data.summativeGrades || {});
                        }
                        setSyncStatus('saved');
                    }, (err) => {
                        console.error(err);
                        setSyncStatus('error');
                    });

                    return () => unsubscribe();
                }
            }, [view, selectedYear, selectedSemester]);

            // --- SIMPAN OTOMATIS ---
            const saveTimeoutRef = useRef(null);
            useEffect(() => {
                if (view === 'app' && window.fbServices) {
                    setSyncStatus('syncing');
                    if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

                    saveTimeoutRef.current = setTimeout(async () => {
                        const { db, doc, setDoc } = window.fbServices;
                        const docId = getDocumentId();
                        await setDoc(doc(db, "schools", docId), {
                            students, topics, topicGrades, summativeGrades, 
                            lastUpdated: new Date().toISOString(),
                            info: { year: selectedYear, semester: selectedSemester, owner: baseCode }
                        });
                        setSyncStatus('saved');
                    }, 1500);
                }
            }, [students, topics, topicGrades, summativeGrades]);

            // --- LOGIKA NILAI ---
            const calculateTaskAvg = (g) => g ? (parseFloat(g.task1||0)+parseFloat(g.task2||0)+parseFloat(g.task3||0))/3 : 0;
            const calculateFinalTopicScore = (g, kkm) => {
                if(!g) return 0;
                const avg = calculateTaskAvg(g);
                return avg < kkm ? Math.max(avg, parseFloat(g.remedial||0)) : avg;
            };
            const calculateFinalReport = (sId) => {
                const s = students.find(st => st.id === sId);
                if (!s) return 0;
                const gl = getGradeLevel(s.classId);
                const cts = topics.filter(t => t.classId === gl);
                if (!cts.length) return 0;
                let tot = 0; cts.forEach(t => tot += calculateFinalTopicScore(topicGrades[`${sId}_${t.id}`], t.kkm));
                return ((tot/cts.length) * 0.7) + (parseFloat(summativeGrades[sId]||0) * 0.3);
            };

            // --- IMPORT EXCEL ---
            const handleImportExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = (evt) => {
                    try {
                        const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        let cnt = 0;
                        const nS = [...students];
                        
                        // Mencari baris header "Nama"
                        let headerIndex = -1;
                        for(let i=0; i<Math.min(10, json.length); i++) {
                            const row = json[i];
                            // Cek kolom A atau B
                            if ((row[0] && row[0].toString().toLowerCase().includes('nama')) || 
                                (row[1] && row[1].toString().toLowerCase().includes('nama'))) {
                                headerIndex = i;
                                break;
                            }
                        }

                        // Jika ketemu header, mulai baca dari baris setelahnya
                        const startIndex = headerIndex !== -1 ? headerIndex + 1 : 0;

                        for(let i=startIndex; i<json.length; i++) {
                            const row = json[i];
                            // File Ibu: Kolom A=No, Kolom B=Nama. Kadang Kolom A=Nama jika file beda.
                            // Kita prioritaskan Kolom B (Index 1) jika ada isinya, lalu Kolom A (Index 0).
                            let nm = row[1];
                            if (!nm && row[0] && isNaN(row[0])) nm = row[0]; // Fallback jika Kolom A berisi teks (bukan nomor)
                            
                            if (nm && typeof nm === 'string' && nm.length > 2 && !nm.toLowerCase().includes('nama')) {
                                // Cek duplikat sederhana
                                if(!nS.some(s => s.name === nm.trim() && s.classId === selectedClass)) {
                                    nS.push({ id: Date.now()+Math.random().toString(36).substr(2,5), name: nm.trim(), classId: selectedClass });
                                    cnt++;
                                }
                            }
                        }
                        setStudents(nS); alert(`Berhasil import ${cnt} siswa!`);
                        e.target.value = '';
                    } catch (e) { alert("Gagal baca file."); console.error(e); }
                };
                r.readAsArrayBuffer(file);
            };

            // --- DOWNLOAD EXCEL ---
            const downloadCSV = () => {
                const gl = getGradeLevel(selectedClass);
                const cts = topics.filter(t => t.classId === gl);
                const css = students.filter(s => s.classId === selectedClass);
                if(!css.length) return alert("Data kosong.");

                let csv = "data:text/csv;charset=utf-8,";
                csv += `DAFTAR NILAI KELAS ${selectedClass} SEMESTER ${selectedSemester} TH ${selectedYear},,,,,,,,,,,,,,,,,,,,\n`;
                csv += "No,Nama,";
                cts.forEach(t => csv += `${t.name.replace(/,/g,' ')},,,,,`);
                csv += "NILAI AKHIR,,,,,,\n,,";
                cts.forEach(() => csv += "1,2,3,Rt,Akhir,");
                csv += "Rata Materi,70%,Sumatif,30%,RAPOR\n";

                css.forEach((s, i) => {
                    let r = `${i+1},"${s.name}",`;
                    let tot = 0;
                    cts.forEach(t => {
                        const g = topicGrades[`${s.id}_${t.id}`]||{};
                        const f = calculateFinalTopicScore(g, t.kkm);
                        tot += f;
                        r += `${g.task1||0},${g.task2||0},${g.task3||0},${calculateTaskAvg(g).toFixed(1)},${f.toFixed(0)},`;
                    });
                    const avg = cts.length ? tot/cts.length : 0;
                    const v70 = avg*0.7; const sum = parseFloat(summativeGrades[s.id]||0); const v30 = sum*0.3;
                    r += `${avg.toFixed(1)},${v70.toFixed(1)},${sum},${v30.toFixed(1)},${(v70+v30).toFixed(0)}\n`;
                    csv += r;
                });
                
                const safeYear = selectedYear.replace('/','-');
                const l = document.createElement("a"); l.href = encodeURI(csv); 
                l.download = `Nilai_${selectedClass}_Sem${selectedSemester}_${safeYear}.csv`;
                document.body.appendChild(l); l.click(); document.body.removeChild(l);
            };

            const filteredStudents = students.filter(s => s.classId === selectedClass);
            const filteredTopics = topics.filter(t => t.classId === getGradeLevel(selectedClass));

            // --- TAMPILAN LOADING ---
            if (view === 'loading') return <div className="h-screen flex items-center justify-center bg-green-50"><div className="spinner"></div></div>;

            // --- TAMPILAN DASHBOARD (MENU UTAMA) ---
            if (view === 'dashboard') return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-green-50 to-emerald-100 font-sans">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full">
                        <div className="text-center mb-6">
                            <div className="text-5xl mb-2">🏫</div>
                            <h1 className="text-2xl font-bold text-green-800">Aplikasi Rapor Online</h1>
                            <p className="text-gray-500 text-sm">MI Al Raudhatul Islamiyah</p>
                        </div>

                        <div className="space-y-4">
                            <div className="bg-green-50 p-3 rounded-lg border border-green-100">
                                <label className="block text-[10px] font-bold text-green-600 uppercase">Akses Guru</label>
                                <div className="font-bold text-lg text-green-800 flex items-center gap-2">
                                    👤 Ibu Wirdaningsih
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">Pilih Tahun Pelajaran</label>
                                <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="w-full border-2 border-gray-200 p-3 rounded-xl font-bold bg-white focus:border-green-500 outline-none">
                                    {yearList.map(y => <option key={y} value={y}>{y}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">Pilih Semester</label>
                                <div className="flex gap-2">
                                    <button onClick={() => setSelectedSemester('1')} className={`flex-1 py-3 rounded-xl font-bold border-2 ${selectedSemester === '1' ? 'border-green-500 bg-green-50 text-green-700' : 'border-gray-200 text-gray-400'}`}>Semester 1</button>
                                    <button onClick={() => setSelectedSemester('2')} className={`flex-1 py-3 rounded-xl font-bold border-2 ${selectedSemester === '2' ? 'border-green-500 bg-green-50 text-green-700' : 'border-gray-200 text-gray-400'}`}>Semester 2</button>
                                </div>
                            </div>

                            <button onClick={handleEnterApp} className="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-green-700 transition active:scale-95 flex items-center justify-center gap-2">
                                📂 Buka Data
                            </button>
                        </div>
                    </div>
                </div>
            );

            // --- TAMPILAN APLIKASI (INPUT NILAI) ---
            return (
                <div className="pb-24 bg-slate-50 min-h-screen font-sans text-slate-800">
                    <div className="bg-green-700 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
                        <div onClick={() => setView('dashboard')} className="cursor-pointer">
                            <h1 className="text-sm font-bold opacity-80 flex items-center gap-1">⬅ Menu Utama</h1>
                            <div className="font-bold text-lg">{selectedYear} - Sem {selectedSemester}</div>
                        </div>
                        <div className="text-xs font-bold bg-white/10 px-3 py-1 rounded-full flex gap-2 items-center">
                            {syncStatus === 'syncing' ? <><div className="spinner"></div> Simpan...</> : (syncStatus === 'saved' ? '☁️ Aman' : '⚠️ Error')}
                        </div>
                    </div>
                    
                    <div className="p-4">
                        <div className="flex gap-2 overflow-x-auto pb-2 mb-4 hide-scrollbar">
                            {classList.map(cls => <button key={cls} onClick={() => { setSelectedClass(cls); setSelectedTopicIdForInput(''); }} className={`px-4 py-2 rounded-full text-sm font-bold ${selectedClass === cls ? 'bg-green-600 text-white shadow' : 'bg-white border'}`}>{cls}</button>)}
                        </div>

                        {activeTab === 'siswa' && (
                            <div className="max-w-md mx-auto animate-fade-in">
                                <div className="bg-white p-4 rounded-xl shadow-sm border mb-4">
                                    <h2 className="font-bold mb-3">👥 Siswa {selectedClass}</h2>
                                    <button onClick={() => excelInputRef.current.click()} className="w-full bg-emerald-50 text-emerald-700 py-2 rounded mb-3 text-sm font-bold border border-emerald-200">📥 Import Excel</button>
                                    <input type="file" ref={excelInputRef} onChange={handleImportExcel} className="hidden" accept=".xlsx, .xls" />
                                    <div className="flex gap-2"><input value={tempStudentName} onChange={e => setTempStudentName(e.target.value)} placeholder="Nama Siswa..." className="flex-1 border p-2 rounded text-sm" /><button onClick={() => { if(tempStudentName) { setStudents([...students, {id:Date.now().toString(), name:tempStudentName, classId:selectedClass}]); setTempStudentName(''); }}} className="bg-green-600 text-white px-4 rounded font-bold">+</button></div>
                                </div>
                                <div className="space-y-2">{filteredStudents.map((s,i) => (
                                    <div key={s.id} className="bg-white p-3 rounded border flex justify-between items-center shadow-sm">
                                        {editingStudentId===s.id ? <div className="flex w-full gap-2"><input value={editStudentName} onChange={e=>setEditStudentName(e.target.value)} className="border p-1 w-full rounded"/><button onClick={()=>{setStudents(students.map(st=>st.id===s.id?{...st,name:editStudentName}:st));setEditingStudentId(null)}} className="text-green-600">✅</button></div> : <><span className="text-sm font-medium">{i+1}. {s.name}</span><div className="flex gap-1"><button onClick={()=>{setEditingStudentId(s.id);setEditStudentName(s.name)}} className="text-blue-500 text-xs border p-1 rounded">Edit</button><button onClick={()=>{if(confirm('Hapus?'))setStudents(students.filter(st=>st.id!==s.id))}} className="text-red-500 text-xs border p-1 rounded">Hapus</button></div></>}
                                    </div>
                                ))}</div>
                            </div>
                        )}

                        {activeTab === 'materi' && (
                            <div className="max-w-md mx-auto">
                                <div className="bg-white p-4 rounded-xl shadow-sm border mb-4">
                                    <h2 className="font-bold mb-2">📚 Materi</h2>
                                    <input value={tempTopicName} onChange={e => setTempTopicName(e.target.value)} placeholder="Nama Materi..." className="w-full border p-2 rounded text-sm mb-2" />
                                    <div className="flex gap-2 items-center"><span className="text-sm font-bold">KKM:</span><input type="number" value={tempKKM} onChange={e => setTempKKM(e.target.value)} className="w-16 border p-2 rounded text-sm text-center" /><button onClick={() => { if(tempTopicName) { setTopics([...topics, {id:Date.now().toString(), name:tempTopicName, classId:getGradeLevel(selectedClass), kkm:parseInt(tempKKM)||70}]); setTempTopicName(''); }}} className="bg-green-600 text-white px-4 py-2 rounded flex-1 font-bold">Tambah</button></div>
                                </div>
                                <div className="space-y-2">{filteredTopics.map(t => (<div key={t.id} className="bg-white p-3 rounded border flex justify-between items-center shadow-sm"><div><div className="font-bold text-sm">{t.name}</div><div className="text-xs text-gray-500">KKM: {t.kkm}</div></div><button onClick={()=>{if(confirm('Hapus?'))setTopics(topics.filter(top=>top.id!==t.id))}} className="text-red-500 text-xs border p-1 rounded">Hapus</button></div>))}</div>
                            </div>
                        )}

                        {activeTab === 'input' && (
                            <div className="max-w-md mx-auto">
                                <div className="flex bg-white rounded p-1 border mb-4"><button onClick={()=>setInputType('materi')} className={`flex-1 py-2 text-sm font-bold rounded ${inputType==='materi'?'bg-green-100 text-green-800':''}`}>Harian</button><button onClick={()=>setInputType('sumatif')} className={`flex-1 py-2 text-sm font-bold rounded ${inputType==='sumatif'?'bg-purple-100 text-purple-800':''}`}>Sumatif</button></div>
                                <div className="flex justify-end mb-4"><button onClick={()=>setIsGradeEditable(!isGradeEditable)} className={`px-3 py-1 rounded-full text-xs font-bold border ${isGradeEditable?'bg-red-50 text-red-600':'bg-green-50 text-green-600'}`}>{isGradeEditable?'🔓 Edit':'🔒 Kunci'}</button></div>
                                {inputType==='materi' && <><select value={selectedTopicIdForInput} onChange={e=>setSelectedTopicIdForInput(e.target.value)} className="w-full p-3 bg-white border rounded mb-4 font-bold"><option value="">-- Pilih Materi --</option>{filteredTopics.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>{selectedTopicIdForInput && filteredStudents.map(s => { const t=topics.find(top=>top.id===selectedTopicIdForInput); const g=topicGrades[`${s.id}_${t.id}`]; return (<div key={s.id} className="bg-white p-4 rounded border mb-3 shadow-sm"><div className="flex justify-between mb-2"><span className="font-bold">{s.name}</span><span className="text-xs bg-gray-100 px-2 py-1 rounded">Akhir: {calculateFinalTopicScore(g,t.kkm).toFixed(0)}</span></div><div className="grid grid-cols-4 gap-2 mb-2">{['task1','task2','task3'].map((tsk,i)=>(<div key={tsk}><label className="text-[10px] text-center block text-gray-400">T{i+1}</label><input type="number" disabled={!isGradeEditable} className="w-full border p-1 rounded text-center bg-gray-50 focus:bg-white" value={g?.[tsk]||''} onChange={e=>{const k=`${s.id}_${t.id}`; const c=topicGrades[k]||{}; let n=parseFloat(e.target.value); if(isNaN(n))n=0; if(n>100)n=100; setTopicGrades({...topicGrades,[k]:{...c,[tsk]:n}})}} /></div>))}<div className="flex flex-col justify-end text-center"><span className="text-[10px] text-gray-400">Rata</span><span className="text-xs font-bold">{calculateTaskAvg(g).toFixed(0)}</span></div></div><div className="flex items-center gap-2 bg-slate-50 p-2 rounded"><span className="text-xs font-bold">Remedial:</span><input disabled={!isGradeEditable} type="number" className="border w-16 p-1 rounded text-center bg-white" value={g?.remedial||''} onChange={e=>{const k=`${s.id}_${t.id}`; const c=topicGrades[k]||{}; setTopicGrades({...topicGrades,[k]:{...c,remedial:parseFloat(e.target.value)||0}})}} /></div></div>)})}</>}
                                {inputType==='sumatif' && filteredStudents.map(s=>(<div key={s.id} className="bg-white p-4 rounded border mb-2 flex justify-between items-center"><span className="font-bold">{s.name}</span><input disabled={!isGradeEditable} type="number" placeholder="0" className="w-20 text-center text-lg font-bold border-2 p-2 rounded border-purple-200" value={summativeGrades[s.id]||''} onChange={e=>setSummativeGrades({...summativeGrades,[s.id]:e.target.value})} /></div>))}
                            </div>
                        )}

                        {activeTab === 'rekap' && (
                            <div className="max-w-md mx-auto">
                                <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl mb-4 text-center">
                                    <h3 className="font-bold text-blue-800 mb-2">📥 Laporan Rapor</h3>
                                    <p className="text-xs text-blue-600 mb-3">Tahun: {selectedYear} | Semester: {selectedSemester}</p>
                                    <button onClick={downloadCSV} className="bg-green-600 text-white py-2 px-6 rounded-lg text-sm font-bold shadow hover:bg-green-700">Download Excel</button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 z-40 text-gray-500 shadow-lg">
                        {['siswa','materi','input','rekap'].map(t => <button key={t} onClick={()=>setActiveTab(t)} className={`flex flex-col items-center w-16 capitalize ${activeTab===t?'text-green-600 font-bold -translate-y-1 transition':''}`}><span className="text-lg">{t==='siswa'?'👥':t==='materi'?'📚':t==='input'?'📝':'📊'}</span><span className="text-[10px]">{t}</span></button>)}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
